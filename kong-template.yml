_format_version: "3.0"
_transform: true

services:
  - name: organizations-service
    url: "${ORGANIZATIONS_URL}"
    routes:
      # CRUD
      - name: get-organizations-route
        paths:
          - "/organizations"
        strip_path: false

      - name: get-organization-by-id-route
        paths:
          - "~/organizations/\\d+"
        strip_path: false

      - name: create-organization-route
        paths:
          - "/organizations"
        strip_path: false

      - name: update-organization-route
        paths:
          - "~/organizations/\\d+"
        strip_path: false

      - name: delete-organization-route
        paths:
          - "~/organizations/\\d+"
        strip_path: false

      # Usuarios de una organización
      - name: get-users-by-organization-route
        paths:
          - "~/organizations/\\d+/users"
        strip_path: false


  - name: drim-users-service
    url: "${DRIM_USERS_URL}"
    routes:
      # Auth
      - name: login-route
        paths:
          - "/auth/login"
        strip_path: false

      - name: drim-logout-route
        paths:
          - "/auth/logout"
        strip_path: false

      # CRUD
      - name: get-users-route
        paths:
          - "/users"
        strip_path: false

      - name: get-user-by-id-route
        paths:
          - "~/users/\\d+"
        strip_path: false

      - name: create-user-route
        paths:
          - "/users"
        strip_path: false

      - name: update-user-route
        paths:
          - "~/users/\\d+"
        strip_path: false

      - name: delete-user-route
        paths:
          - "~/users/\\d+"
        strip_path: false

      # Role
      - name: get-roles-route
        paths:
          - "/roles"
        strip_path: false

      - name: get-role-by-id-route
        paths:
          - "~/roles/\\d+"
        strip_path: false

      - name: patch-user-role-route
        paths:
          - "~/users/\\d+/roles/\\d+"
        strip_path: false

      # UserStatus
      - name: update-user-status-route
        paths:
          - "~/users/\\d+/status/\\d+"
        strip_path: false
